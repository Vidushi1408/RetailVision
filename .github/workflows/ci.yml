name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -r requirements.txt
      - name: Cache YOLO weights
        uses: actions/cache@v4
        with:
          path: yolov8s.pt
          key: yolo-weights-yolov8s-v1
      - name: Unit and API tests
        env:
          PRELOAD_MODELS: none
        run: python -m unittest test_retailvision test_api test_counting test_security -v
